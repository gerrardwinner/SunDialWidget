name: Build Sundial Widget APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Sundial Project
        run: |
          python3 - << 'EOF'
          import os
          import textwrap

          files = {
              "settings.gradle": """
                  rootProject.name = "SundialWidget"
                  include ':app'
              """,

              "build.gradle": """
                  buildscript {
                      repositories {
                          google()
                          mavenCentral()
                      }
                      dependencies {
                          classpath 'com.android.tools.build:gradle:8.1.4'
                      }
                  }
                  allprojects {
                      repositories {
                          google()
                          mavenCentral()
                      }
                  }
              """,

              "gradle.properties": """
                  org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
                  android.useAndroidX=true
              """,

              "app/build.gradle": """
                  plugins {
                      id 'com.android.application'
                  }

                  android {
                      namespace 'com.example.sundialwidget'
                      compileSdk 34

                      defaultConfig {
                          applicationId "com.example.sundialwidget"
                          minSdk 21
                          targetSdk 34
                          versionCode 3
                          versionName "1.2"
                      }

                      buildTypes {
                          release {
                              minifyEnabled false
                          }
                      }
                      compileOptions {
                          sourceCompatibility JavaVersion.VERSION_17
                          targetCompatibility JavaVersion.VERSION_17
                      }
                  }
              """,

              "app/src/main/AndroidManifest.xml": """
                  <?xml version="1.0" encoding="utf-8"?>
                  <manifest xmlns:android="http://schemas.android.com/apk/res/android">

                      <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
                      <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

                      <application
                          android:allowBackup="true"
                          android:label="Sundial Widget"
                          android:icon="@android:drawable/ic_menu_compass"
                          android:theme="@android:style/Theme.DeviceDefault">

                          <activity
                              android:name=".MainActivity"
                              android:exported="true">
                              <intent-filter>
                                  <action android:name="android.intent.action.MAIN" />
                                  <category android:name="android.intent.category.LAUNCHER" />
                              </intent-filter>
                          </activity>

                          <receiver
                              android:name=".SundialWidgetProvider"
                              android:exported="true">
                              <intent-filter>
                                  <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                                  <action android:name="com.example.sundialwidget.ACTION_TOGGLE" />
                              </intent-filter>
                              <meta-data
                                  android:name="android.appwidget.provider"
                                  android:resource="@xml/sundial_info" />
                          </receiver>

                      </application>
                  </manifest>
              """,

              "app/src/main/res/xml/sundial_info.xml": """
                  <?xml version="1.0" encoding="utf-8"?>
                  <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
                      android:minWidth="250dp"
                      android:minHeight="250dp"
                      android:updatePeriodMillis="1800000"
                      android:initialLayout="@layout/widget_sundial"
                      android:resizeMode="horizontal|vertical"
                      android:widgetCategory="home_screen" />
              """,

              "app/src/main/res/layout/widget_sundial.xml": """
                  <?xml version="1.0" encoding="utf-8"?>
                  <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:orientation="vertical"
                      android:background="#2C2416"
                      android:gravity="center"
                      android:padding="8dp">

                      <TextView
                          android:id="@+id/tv_mode"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="🏛️ โหมดนาฬิกาแดด"
                          android:textColor="#FFD54F"
                          android:textSize="11sp"
                          android:textStyle="bold"
                          android:paddingBottom="2dp" />

                      <FrameLayout
                          android:layout_width="120dp"
                          android:layout_height="120dp"
                          android:layout_margin="4dp"
                          android:background="@drawable/sundial_face">
                      </FrameLayout>

                      <TextView
                          android:id="@+id/tv_time_desc"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="กดปุ่มเพื่อสลับโหมดกลางวัน/กลางคืน"
                          android:textColor="#D7CCC8"
                          android:textSize="10sp"
                          android:gravity="center"
                          android:paddingTop="2dp"
                          android:paddingBottom="4dp" />

                      <Button
                          android:id="@+id/btn_sync"
                          android:layout_width="wrap_content"
                          android:layout_height="28dp"
                          android:text="🔄 สลับโหมด ☀️/🌙"
                          android:textSize="9sp" />
                  </LinearLayout>
              """,

              "app/src/main/res/drawable/sundial_face.xml": """
                  <?xml version="1.0" encoding="utf-8"?>
                  <shape xmlns:android="http://schemas.android.com/apk/res/android"
                      android:shape="oval">
                      <solid android:color="#1A150E" />
                      <stroke android:width="3dp" android:color="#D4AF37" />
                  </shape>
              """,

              "app/src/main/java/com/example/sundialwidget/MainActivity.java": """
                  package com.example.sundialwidget;

                  import android.app.Activity;
                  import android.graphics.Color;
                  import android.os.Bundle;
                  import android.view.Gravity;
                  import android.widget.LinearLayout;
                  import android.widget.TextView;

                  public class MainActivity extends Activity {
                      @Override
                      protected void onCreate(Bundle savedInstanceState) {
                          super.onCreate(savedInstanceState);

                          LinearLayout layout = new LinearLayout(this);
                          layout.setOrientation(LinearLayout.VERTICAL);
                          layout.setPadding(40, 40, 40, 40);
                          layout.setGravity(Gravity.CENTER_HORIZONTAL);
                          layout.setBackgroundColor(Color.parseColor("#181615"));

                          TextView title = new TextView(this);
                          title.setText("🏛️ Solar & Lunar Sundial Widget");
                          title.setTextColor(Color.parseColor("#FFD54F"));
                          title.setTextSize(18f);
                          title.setGravity(Gravity.CENTER);
                          title.setPadding(0, 0, 0, 20);
                          layout.addView(title);

                          TextView desc = new TextView(this);
                          desc.setText("เวอร์ชัน 1.2: เพิ่มปุ่มสลับโหมดกลางวัน/กลางคืนบน Widget โดยตรง!\\n\\nไปที่หน้าจอหลัก -> เพิ่ม Widget -> เลือก 'Sundial Widget' แล้วกดปุ่มสลับโหมดทดสอบได้เลยครับ");
                          desc.setTextColor(Color.parseColor("#D7CCC8"));
                          desc.setTextSize(14f);
                          layout.addView(desc);

                          setContentView(layout);
                      }
                  }
              """,

              "app/src/main/java/com/example/sundialwidget/SundialWidgetProvider.java": """
                  package com.example.sundialwidget;

                  import android.app.PendingIntent;
                  import android.appwidget.AppWidgetManager;
                  import android.appwidget.AppWidgetProvider;
                  import android.content.Context;
                  import android.content.Intent;
                  import android.content.SharedPreferences;
                  import android.os.Build;
                  import android.widget.RemoteViews;

                  public class SundialWidgetProvider extends AppWidgetProvider {
                      private static final String PREFS_NAME = "com.example.sundialwidget.Prefs";
                      private static final String PREF_PREFIX_KEY = "is_night_";

                      @Override
                      public void onUpdate(Context context, AppWidgetManager appWidgetManager, int[] appWidgetIds) {
                          for (int appWidgetId : appWidgetIds) {
                              updateWidget(context, appWidgetManager, appWidgetId);
                          }
                      }

                      @Override
                      public void onReceive(Context context, Intent intent) {
                          super.onReceive(context, intent);
                          if ("com.example.sundialwidget.ACTION_TOGGLE".equals(intent.getAction())) {
                              int appWidgetId = intent.getIntExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, AppWidgetManager.INVALID_APPWIDGET_ID);
                              if (appWidgetId != AppWidgetManager.INVALID_APPWIDGET_ID) {
                                  SharedPreferences prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                                  boolean currentNight = prefs.getBoolean(PREF_PREFIX_KEY + appWidgetId, false);
                                  prefs.edit().putBoolean(PREF_PREFIX_KEY + appWidgetId, !currentNight).apply();

                                  AppWidgetManager appWidgetManager = AppWidgetManager.getInstance(context);
                                  updateWidget(context, appWidgetManager, appWidgetId);
                              }
                          }
                      }

                      static void updateWidget(Context context, AppWidgetManager appWidgetManager, int appWidgetId) {
                          RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.widget_sundial);

                          SharedPreferences prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                          boolean isNight = prefs.getBoolean(PREF_PREFIX_KEY + appWidgetId, false);

                          if (isNight) {
                              views.setTextViewText(R.id.tv_mode, "🌙 นาฬิกาดวงดาว (Lunar Astrolabe)");
                              views.setTextViewText(R.id.tv_time_desc, "โหมดกลางคืน | จำลองเงาดวงจันทร์");
                          } else {
                              views.setTextViewText(R.id.tv_mode, "☀️ นาฬิกาแดด (Solar Sundial)");
                              views.setTextViewText(R.id.tv_time_desc, "โหมดกลางวัน | เงาทอดยาวตามตะวัน");
                          }

                          Intent intent = new Intent(context, SundialWidgetProvider.class);
                          intent.setAction("com.example.sundialwidget.ACTION_TOGGLE");
                          intent.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, appWidgetId);
                          
                          int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              flags |= PendingIntent.FLAG_IMMUTABLE;
                          }
                          PendingIntent pendingIntent = PendingIntent.getBroadcast(context, appWidgetId, intent, flags);
                          views.setOnClickPendingIntent(R.id.btn_sync, pendingIntent);

                          appWidgetManager.updateAppWidget(appWidgetId, views);
                      }
                  }
              """
          }

          for path, content in files.items():
              full_path = os.path.join("SundialProject", path)
              os.makedirs(os.path.dirname(full_path), exist_ok=True)
              clean_content = textwrap.dedent(content).strip() + "\n"
              with open(full_path, "w", encoding="utf-8") as f:
                  f.write(clean_content)

          print("Sundial Project v1.2 generated successfully!")
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        working-directory: ./SundialProject
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SundialWidget-v1.2-APK
          path: SundialProject/app/build/outputs/apk/debug/app-debug.apk
